[features]
hooks = true # numbat-managed

# BEGIN numbat managed codex hooks
[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "'__NUMBAT_BIN__' hook codex-pre-tool --agent codex --installed-by=numbat --output=file --output-file '__OUTPUT_FILE__'"
timeout = 10
# END numbat managed codex hooks
