[package]
name = "sandy-sandbox"
description = "Typed current-process sandboxing for Rust applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sandbox", "security", "linux", "macos", "agents"]
categories = ["development-tools", "os::linux-apis", "os::macos-apis"]

[features]
live-tests = []

[lib]
name = "sandy"

[lints]
workspace = true

[dependencies]
sandy-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sandy-seatbelt.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sandy-linux.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "live_macos"
path = "tests/live_macos.rs"
harness = false
required-features = ["live-tests"]

[[test]]
name = "live_linux"
path = "tests/live_linux.rs"
harness = false
required-features = ["live-tests"]
