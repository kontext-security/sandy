name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing release tag to build and publish
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: Token allowed to publish Sandy packages to crates.io
        required: true
      HOMEBREW_TAP_TOKEN:
        description: Token with contents write access to kontext-security/homebrew-tap
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_commit: ${{ steps.verify-tag.outputs.tag_commit }}
    steps:
      - name: Check out trusted release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Fetch tags before checkout removes its ephemeral credentials.
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify release tag
        id: verify-tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if test "$GITHUB_REF" != "refs/heads/main"; then
            echo "release workflows must run from main" >&2
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"; then
            echo "release tag $TAG_NAME was not fetched by the trusted checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo "release tag $TAG_NAME is not contained in the trusted main revision" >&2
            exit 1
          fi
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$TAG_NAME"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            archive_arch: arm64
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            archive_arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag_commit }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --target "${{ matrix.target }}"
      - name: Verify tag version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$cargo_version"
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}" -p sandy-cli
      - name: Package release
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.archive_arch }}
        run: |
          version="${TAG_NAME#v}"
          asset="sandy_${version}_darwin_${ARCH}"
          mkdir -p "dist/${asset}"
          install -m 0755 "target/${TARGET}/release/sandy" "dist/${asset}/sandy"
          cp LICENSE README.md "dist/${asset}/"
          COPYFILE_DISABLE=1 tar -C "dist/${asset}" -czf "dist/${asset}.tar.gz" sandy LICENSE README.md
          shasum -a 256 "dist/${asset}.tar.gz" | awk '{print $1}' > "dist/${asset}.tar.gz.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          ARCH: ${{ matrix.archive_arch }}
        run: |
          version="${TAG_NAME#v}"
          asset="sandy_${version}_darwin_${ARCH}.tar.gz"
          gh release upload "$TAG_NAME" "dist/$asset" "dist/${asset}.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  publish-crates:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag_commit }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal
      - name: Verify tag version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$cargo_version"
      - name: Verify publishable packages
        run: cargo package --workspace --exclude sandy-cli --locked
      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked
      - name: Publish packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo release publish --execute --no-confirm \
            --package sandy-core \
            --package sandy-seatbelt \
            --package sandy-sandbox

  publish:
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  formula:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kontext-security/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: false
      - name: Render Sandy formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          arm_asset="sandy_${version}_darwin_arm64.tar.gz.sha256"
          amd_asset="sandy_${version}_darwin_amd64.tar.gz.sha256"
          mkdir checksums
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.sha256" --dir checksums
          arm_sha="$(tr -d '[:space:]' < "checksums/$arm_asset")"
          amd_sha="$(tr -d '[:space:]' < "checksums/$amd_asset")"
          ./scripts/render-homebrew-formula.sh "$version" "$arm_sha" "$amd_sha" > homebrew-tap/Formula/sandy.rb
          ruby -c homebrew-tap/Formula/sandy.rb
      - name: Verify formula update scope
        id: formula-diff
        run: |
          changed="$(git -C homebrew-tap diff --name-only)"
          if test -z "$changed"; then
            echo "Formula/sandy.rb is already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif test "$changed" = "Formula/sandy.rb"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected Homebrew tap changes:" >&2
            echo "$changed" >&2
            exit 1
          fi
      - name: Upload generated formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" homebrew-tap/Formula/sandy.rb --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish Homebrew formula
        if: ${{ steps.formula-diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          formula_sha="$(git -C homebrew-tap rev-parse HEAD:Formula/sandy.rb)"
          formula_content="$(base64 --wrap=0 homebrew-tap/Formula/sandy.rb)"
          jq -n \
            --arg message "chore: update sandy formula to ${version}" \
            --arg content "$formula_content" \
            --arg sha "$formula_sha" \
            '{message: $message, content: $content, sha: $sha, branch: "main"}' \
            > formula-update.json
          gh api --method PUT \
            repos/kontext-security/homebrew-tap/contents/Formula/sandy.rb \
            --input formula-update.json
