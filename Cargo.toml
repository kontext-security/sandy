[workspace]
members = ["crates/core", "crates/seatbelt", "crates/cli"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/kontext-security/sandy"
homepage = "https://github.com/kontext-security/sandy"
authors = ["Kontext Security"]

[workspace.dependencies]
assert_cmd = "2.0.17"
clap = { version = "4.5.51", features = ["derive"] }
libc = "0.2.177"
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"

sandy-core = { path = "crates/core", version = "0.1.6" }
sandy-seatbelt = { path = "crates/seatbelt", version = "0.1.6" }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
